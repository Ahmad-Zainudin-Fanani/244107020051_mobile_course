name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  verify:
    name: analyze, format, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      # Minggu 1-7 belum dicek format karena kodenya memakai gaya lama
      # (formatter baru akan mengubah banyak berkas). Analisis dan test tetap
      # dijalankan supaya kegagalan seperti widget test bawaan template
      # langsung terdeteksi.

      - name: Week 1 - install dependencies
        working-directory: 01-week-1-mobile-development-ecosystem-flutter-refresh
        run: flutter pub get

      - name: Week 1 - static analysis
        working-directory: 01-week-1-mobile-development-ecosystem-flutter-refresh
        run: flutter analyze

      - name: Week 1 - widget test
        working-directory: 01-week-1-mobile-development-ecosystem-flutter-refresh
        run: flutter test

      - name: Week 2 - install dependencies
        working-directory: 02-week-2-declarative-ui-responsive-design
        run: flutter pub get

      - name: Week 2 - static analysis
        working-directory: 02-week-2-declarative-ui-responsive-design
        run: flutter analyze

      - name: Week 2 - widget tests
        working-directory: 02-week-2-declarative-ui-responsive-design
        run: flutter test

      - name: Week 3 - install dependencies
        working-directory: 03-week-3-navigation-state-management
        run: flutter pub get

      - name: Week 3 - static analysis
        working-directory: 03-week-3-navigation-state-management
        run: flutter analyze

      - name: Week 3 - unit and widget tests
        working-directory: 03-week-3-navigation-state-management
        run: flutter test

      - name: Week 4 - install dependencies
        working-directory: 04-week-4-networking-rest-api
        run: flutter pub get

      - name: Week 4 - static analysis
        working-directory: 04-week-4-networking-rest-api
        run: flutter analyze

      - name: Week 4 - unit and widget tests
        working-directory: 04-week-4-networking-rest-api
        run: flutter test

      - name: Week 5 - install dependencies
        working-directory: 05-week-5-local-storage-offline-first
        run: flutter pub get

      - name: Week 5 - static analysis
        working-directory: 05-week-5-local-storage-offline-first
        run: flutter analyze

      - name: Week 5 - widget test
        working-directory: 05-week-5-local-storage-offline-first
        run: flutter test

      - name: Week 6 - install dependencies
        working-directory: 06-week-6-authentication-security-fcm
        run: flutter pub get

      - name: Week 6 - static analysis
        working-directory: 06-week-6-authentication-security-fcm
        run: flutter analyze

      - name: Week 6 - unit and widget tests
        working-directory: 06-week-6-authentication-security-fcm
        run: flutter test

      - name: Week 7 - install dependencies
        working-directory: 07-week-7-clean-architecture
        run: flutter pub get

      - name: Week 7 - static analysis
        working-directory: 07-week-7-clean-architecture
        run: flutter analyze

      - name: Week 7 - unit and widget tests
        working-directory: 07-week-7-clean-architecture
        run: flutter test

      - name: Week 8 - install dependencies
        working-directory: 08-week-8-mid-project-review
        run: flutter pub get

      - name: Week 8 - static analysis
        working-directory: 08-week-8-mid-project-review
        run: flutter analyze

      - name: Week 8 - formatting check
        working-directory: 08-week-8-mid-project-review
        run: dart format --output=none --set-exit-if-changed .

      - name: Week 8 - unit tests
        working-directory: 08-week-8-mid-project-review
        run: flutter test

      - name: Week 9 - install dependencies
        working-directory: 09-week-9-ai-assisted-development
        run: flutter pub get

      - name: Week 9 - static analysis
        working-directory: 09-week-9-ai-assisted-development
        run: flutter analyze

      - name: Week 9 - formatting check
        working-directory: 09-week-9-ai-assisted-development
        run: dart format --output=none --set-exit-if-changed .

      - name: Week 9 - unit tests
        working-directory: 09-week-9-ai-assisted-development
        run: flutter test

      - name: Week 10 - install dependencies
        working-directory: 10-week-10-ai-feature-integration
        run: flutter pub get

      - name: Week 10 - static analysis
        working-directory: 10-week-10-ai-feature-integration
        run: flutter analyze

      - name: Week 10 - formatting check
        working-directory: 10-week-10-ai-feature-integration
        run: dart format --output=none --set-exit-if-changed .

      - name: Week 10 - unit tests
        working-directory: 10-week-10-ai-feature-integration
        run: flutter test

      - name: Week 11 - install dependencies
        working-directory: 11-week-11-performance-optimization
        run: flutter pub get

      - name: Week 11 - static analysis
        working-directory: 11-week-11-performance-optimization
        run: flutter analyze

      - name: Week 11 - formatting check
        working-directory: 11-week-11-performance-optimization
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Week 11 - unit and widget tests
        working-directory: 11-week-11-performance-optimization
        run: flutter test

      - name: Week 12 - install SQLite for FFI tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Week 12 - install dependencies
        working-directory: 12-week-12-testing-quality-assurance
        run: flutter pub get

      - name: Week 12 - static analysis
        working-directory: 12-week-12-testing-quality-assurance
        run: flutter analyze

      - name: Week 12 - formatting check
        working-directory: 12-week-12-testing-quality-assurance
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Week 12 - unit and widget tests with coverage
        working-directory: 12-week-12-testing-quality-assurance
        run: flutter test --coverage
